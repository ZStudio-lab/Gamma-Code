ShortDescription: Local-only, terminal-native AI coding agent for Windows.
Description: |-
  Gamma Code is a local-only, terminal-native AI coding agent for Windows.
  It talks only to Ollama on 127.0.0.1:11434 - no cloud, no API keys, no
  telemetry. Not the prompt, not the code, not the conversation ever leaves
  the machine. Replies stream live, with tool-call JSON kept behind the
  normal spinner. Tools: read_file, write_file/edit_file (line-ending and
  indentation-tolerant matching, replace_all), list_dir/glob/grep
  (gitignore-aware, capped), run_command (cmd.exe /c), ask (pause for a human
  decision), and web_search (DuckDuckGo - the one outbound tool;
  GAMMA_NO_WEB=1 removes it). Model traffic only ever talks to Ollama on
  127.0.0.1:11434. On first run it offers to install Ollama,
  pulls the best qwen2.5-coder model for the machine's RAM/VRAM, then starts
  ollama serve and uses the newest installed tool-capable model. Permission
  modes: auto (default - hands-free,
  --no-yolo re-adds the run_command prompt), ask (writes and commands prompt
  y/N with the diff or command shown), plan (read-only). Ollama itself is not
  bundled.
